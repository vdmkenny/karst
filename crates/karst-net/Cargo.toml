[package]
name = "karst-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A network that runs: directory, mix runner, provider, client"

[dependencies]
karst-mix.workspace = true
karst-node.workspace = true
karst-wire.workspace = true
karst-seal.workspace = true
karst-id.workspace = true
karst-object.workspace = true
karst-blob.workspace = true
rand = "0.8"
blake3 = "1"
merlin = { version = "3", default-features = false }
schnorrkel = { version = "0.11", default-features = false, features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[[bin]]
name = "karst-net-demo"
path = "src/bin/karst-net-demo.rs"

[[bin]]
name = "karst-bulkcost"
path = "src/bin/karst-bulkcost.rs"

[lints]
workspace = true

[package]
name = "karst-mix"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KARST L4 Mixing: layered packets, Poisson delay, constant-rate cover, and a global passive adversary simulator"

[[bin]]
name = "karst-mixsim"
path = "src/bin/mixsim.rs"

[dependencies]
karst-id.workspace = true
karst-object.workspace = true
blake3 = { workspace = true, features = ["traits-preview"] }
rand.workspace = true
curve25519-dalek = "4"
subtle = { version = "2.6", default-features = false }
lioness-rs = "0.2"
chacha20 = "0.10"

[dev-dependencies]
# A second, independent LIONESS implementation, used only to cross-check the first.
lioness = "0.1"
blake2 = "0.11.0-rc.6"

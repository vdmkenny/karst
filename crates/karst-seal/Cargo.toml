[package]
name = "karst-seal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anonymous authenticated encryption to a public key"

[dependencies]
rand.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
hpke = { version = "0.14", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }

[workspace]
resolver = "2"
members = [
    "crates/karst-id",
    "crates/karst-object",
    "crates/karst-path",
    "crates/karst-doc",
    "crates/karst-agency",
    "crates/karst-blob",
    "crates/karst-cap",
    "crates/karst-member",
    "crates/karst-mix",
    "crates/karst-node",
    "crates/karst-index",
    "crates/karst-net",
    "crates/karst-stack",
    "crates/karst-seal",
    "crates/karst-wire",
    "crates/karst-symmetry",
    "crates/karst-value",
    "crates/karst-witness",
    "crates/karst-fuzz",
    "crates/karst-attest",
    "crates/karst-afford",
    "crates/karst-thread",
    "crates/karst-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unset/karst"

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
rand = "0.8"
hex = "0.4"
rsa = "0.9"
num-bigint-dig = "0.8"

karst-id = { path = "crates/karst-id" }
karst-object = { path = "crates/karst-object" }
karst-path = { path = "crates/karst-path" }
karst-doc = { path = "crates/karst-doc" }
karst-agency = { path = "crates/karst-agency" }
karst-blob = { path = "crates/karst-blob" }
karst-cap = { path = "crates/karst-cap" }
karst-member = { path = "crates/karst-member" }
karst-mix = { path = "crates/karst-mix" }
karst-node = { path = "crates/karst-node" }
karst-index = { path = "crates/karst-index" }
karst-net = { path = "crates/karst-net" }
karst-stack = { path = "crates/karst-stack" }
karst-seal = { path = "crates/karst-seal" }
karst-wire = { path = "crates/karst-wire" }
karst-symmetry = { path = "crates/karst-symmetry" }
karst-value = { path = "crates/karst-value" }
karst-witness = { path = "crates/karst-witness" }
karst-attest = { path = "crates/karst-attest" }
karst-afford = { path = "crates/karst-afford" }
karst-thread = { path = "crates/karst-thread" }
